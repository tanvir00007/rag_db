services:
  postgres:
    image: postgres:18.6
    container_name: rag-db-postgres
    restart: unless-stopped
    env_file:
      - ./docker/postgres.env
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rag_db_postgres_data:/var/lib/postgresql

volumes:
  rag_db_postgres_data:
